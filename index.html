<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPK CORE | Stable Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #6366f1;
            --bg: #010204;
            --card-bg: rgba(10, 12, 18, 0.7);
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .font-heading { font-family: 'Space Grotesk', sans-serif; }

        #snow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            will-change: transform;
        }

        .bg-glow {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% -10%, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
            z-index: 0;
        }

        .scene-transition {
            animation: sceneEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes sceneEnter {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .folder-preview {
            position: relative; height: 180px; display: flex; justify-content: center; align-items: center;
        }
        .folder-img {
            position: absolute; width: 70%; height: 85%;
            border-radius: 24px; object-fit: cover;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .img-1 { transform: translateZ(30px); z-index: 3; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .img-2 { transform: rotate(-12deg) translateX(-20%) scale(0.9); z-index: 2; opacity: 0.4; }
        
        .glass-card:hover .img-1 { transform: scale(1.08) translateY(-10px); }
        .glass-card:hover .img-2 { transform: rotate(-18deg) translateX(-35%) scale(0.95); opacity: 0.7; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 32px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.4s ease;
        }
        .mod-card:hover {
            transform: translateY(-12px);
            border-color: var(--accent);
            background: rgba(255,255,255,0.02);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 20px rgba(99, 102, 241, 0.15);
        }
        .mod-selected {
            border-color: var(--accent) !important;
            background: rgba(99, 102, 241, 0.15) !important;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.15);
        }

        .check-overlay {
            position: absolute; inset: 0;
            background: rgba(99, 102, 241, 0.2);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none;
            border-radius: 1rem;
        }
        .mod-selected .check-overlay { opacity: 1; }

        .lang-switch {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 4px; border-radius: 16px; display: flex; gap: 4px;
        }
        .lang-node {
            padding: 6px 14px; border-radius: 12px; font-size: 11px; font-weight: 800;
            cursor: pointer; transition: all 0.3s; color: #64748b;
        }
        .lang-node.active { background: var(--accent); color: #fff; }

        #toast {
            position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%) translateY(30px);
            background: #6366f1; color: white; padding: 12px 28px; border-radius: 100px;
            font-size: 13px; font-weight: 700; opacity: 0; transition: all 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 10000;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <canvas id="snow"></canvas>
    <div class="bg-glow"></div>

    <div class="relative z-10 min-h-screen flex flex-col p-8 md:p-16">
        <header class="max-w-7xl mx-auto w-full mb-24 flex flex-col md:flex-row justify-between items-end gap-12">
            <div>
                <h1 class="font-heading text-8xl font-black tracking-tighter leading-none mb-6 scene-transition">VPK<span class="text-indigo-500">.</span>CORE</h1>
                <div class="px-5 py-2 bg-emerald-500/5 border border-emerald-500/10 rounded-full inline-flex items-center gap-3">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span id="label-update" class="text-[10px] font-bold uppercase tracking-[0.2em] text-emerald-400">Update: 28.12.2025</span>
                </div>
            </div>

            <div class="flex items-center gap-6 w-full md:w-auto">
                <div class="flex items-center bg-white/5 border border-white/5 rounded-2xl px-5 py-4 backdrop-blur-3xl focus-within:border-indigo-500/40 transition-all flex-grow md:w-80">
                    <svg class="w-4 h-4 text-neutral-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="3"/></svg>
                    <input type="text" id="search-input" placeholder="Поиск..." class="bg-transparent border-none outline-none w-full text-sm placeholder:text-neutral-700">
                </div>
                <div class="lang-switch">
                    <div onclick="setLang('ru')" id="lang-ru" class="lang-node">RU</div>
                    <div onclick="setLang('en')" id="lang-en" class="lang-node">EN</div>
                </div>
            </div>
        </header>

        <main id="app-content" class="max-w-7xl mx-auto w-full flex-grow"></main>

        <div class="fixed bottom-10 left-1/2 -translate-x-1/2 w-full max-w-2xl px-6 z-50">
            <div class="glass-card p-6 flex items-center justify-between border-white/10 shadow-3xl">
                <div class="flex items-center gap-8">
                    <div>
                        <span id="count" class="text-5xl font-heading font-black text-indigo-500">0</span>
                        <p id="label-selected" class="text-[9px] uppercase font-black text-neutral-600 tracking-widest mt-1">Files selected</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="shareSet()" class="btn-action p-4 bg-white/5 hover:bg-white/10 rounded-2xl text-neutral-500 hover:text-white transition-all">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" stroke-width="2.5"/></svg>
                    </button>
                    <button id="dl-btn" onclick="build()" class="btn-action bg-white text-black px-12 py-5 rounded-2xl font-black text-xs uppercase tracking-[0.2em] hover:bg-indigo-50 shadow-xl disabled:opacity-5">Build</button>
                </div>
            </div>
            <div id="p-wrap" class="mt-3 h-1.5 w-full bg-white/5 rounded-full overflow-hidden opacity-0 transition-opacity">
                <div id="p-fill" class="h-full bg-indigo-500 w-0 transition-all duration-500"></div>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const JSON_URL = 'https://ssixm.github.io/VpkDota2Mods/src/config.json';
        const TRANSLATIONS = {
            ru: { search: 'Поиск модификаций...', selected: 'Выбрано файлов', back: 'Назад к папкам', build: 'Собрать VPK', update: 'Обновлено: 28.12.2025', copy: 'Ссылка скопирована!', empty: 'Ничего не выбрано!', modsCount: 'Модификаций' },
            en: { search: 'Search mods...', selected: 'Files selected', back: 'Back to folders', build: 'Build VPK', update: 'Updated: Dec 28, 2025', copy: 'Link copied!', empty: 'Select something!', modsCount: 'Modifications' }
        };

        let CONFIG = [];
        let lang = localStorage.getItem('vpk_lang') || 'ru';
        let selected = new Set(JSON.parse(localStorage.getItem('vpk_selected') || '[]'));
        let currentCat = null;

        async function loadConfig() {
            try {
                const res = await fetch(JSON_URL);
                CONFIG = await res.json();
            } catch (e) {
                console.error("Config load failed", e);
                CONFIG = []; // Можно добавить фолбэк данные сюда
            }
            renderCategories();
        }

        function setLang(l) {
            lang = l;
            localStorage.setItem('vpk_lang', l);
            document.querySelectorAll('.lang-node').forEach(n => n.classList.toggle('active', n.id === `lang-${l}`));
            updateUIStrings();
            currentCat ? renderMods(currentCat) : renderCategories();
        }

        function updateUIStrings() {
            const t = TRANSLATIONS[lang];
            document.getElementById('search-input').placeholder = t.search;
            document.getElementById('label-selected').textContent = t.selected;
            document.getElementById('label-update').textContent = t.update;
            document.getElementById('dl-btn').textContent = t.build;
        }

        function renderCategories(filter = '') {
            currentCat = null;
            const filtered = CONFIG.filter(cat => 
                cat[lang].toLowerCase().includes(filter.toLowerCase())
            );

            document.getElementById('app-content').innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-10 scene-transition">
                ${filtered.map(cat => `
                    <div onclick="renderMods('${cat.id}')" class="glass-card p-10 cursor-pointer group">
                        <div class="folder-preview mb-10">
                            <img src="https://ssixm.github.io/VpkDota2Mods/src/${cat.mods[0].img}" class="folder-img img-1">
                            <img src="https://ssixm.github.io/VpkDota2Mods/src/${cat.mods[1]?.img || cat.mods[0].img}" class="folder-img img-2">
                        </div>
                        <h3 class="font-heading text-4xl font-black mb-3 group-hover:text-indigo-400 transition-colors">${cat[lang]}</h3>
                        <p class="text-neutral-600 text-[10px] uppercase font-bold tracking-[0.2em]">${cat.mods.length} ${TRANSLATIONS[lang].modsCount}</p>
                    </div>
                `).join('')}
            </div>`;
            updateSelection();
        }

        function renderMods(catId, filter = '') {
            currentCat = catId;
            const cat = CONFIG.find(c => c.id === catId);
            const filteredMods = cat.mods.filter(m => 
                m['name_'+lang].toLowerCase().includes(filter.toLowerCase()) ||
                m['desc_'+lang].toLowerCase().includes(filter.toLowerCase())
            );

            document.getElementById('app-content').innerHTML = `
                <div class="scene-transition">
                    <button onclick="renderCategories()" class="btn-action flex items-center gap-4 mb-12 text-neutral-600 hover:text-white group">
                        <div class="p-2 bg-white/5 rounded-lg group-hover:bg-indigo-600 transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="3"/></svg>
                        </div>
                        <span class="text-xs font-black uppercase tracking-[0.3em]">${TRANSLATIONS[lang].back}</span>
                    </button>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6" id="mods-grid">
                        ${filteredMods.map(m => `
                            <div onclick="toggleMod(${m.id}, '${catId}')" id="mod-${m.id}" 
                                 class="glass-card mod-card p-6 cursor-pointer ${selected.has(m.id) ? 'mod-selected' : ''}">
                                <div class="aspect-video rounded-2xl overflow-hidden mb-6 bg-black relative">
                                    <img src="https://ssixm.github.io/VpkDota2Mods/src/${m.img}" class="w-full h-full object-cover">
                                    <div class="check-overlay">
                                        <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>
                                    </div>
                                </div>
                                <h4 class="font-heading text-xl font-bold mb-1">${m['name_'+lang]}</h4>
                                <p class="text-neutral-500 text-[10px] font-bold uppercase tracking-tight">${m['desc_'+lang]}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
        }

        // --- ПОИСК ---
        document.getElementById('search-input').addEventListener('input', (e) => {
            const val = e.target.value;
            if (currentCat) {
                renderMods(currentCat, val);
            } else {
                renderCategories(val);
            }
        });

        function toggleMod(id, catId) {
            const cat = CONFIG.find(c => c.id === catId);
            if(cat && cat.exclusive) {
                cat.mods.forEach(m => {
                    if(m.id !== id && selected.has(m.id)) {
                        selected.delete(m.id);
                        document.getElementById(`mod-${m.id}`)?.classList.remove('mod-selected');
                    }
                });
            }

            const card = document.getElementById(`mod-${id}`);
            if(selected.has(id)) {
                selected.delete(id);
                card?.classList.remove('mod-selected');
            } else {
                selected.add(id);
                card?.classList.add('mod-selected');
            }
            
            localStorage.setItem('vpk_selected', JSON.stringify([...selected]));
            updateSelection();
        }

        function updateSelection() {
            document.getElementById('count').textContent = selected.size;
            document.getElementById('dl-btn').disabled = selected.size === 0;
        }

        // --- ТВОЙ ВАРИАНТ СНЕГА (БЕЗ ИЗМЕНЕНИЙ) ---
        function initSnow() {
            const canvas = document.getElementById('snow');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let lastTime = performance.now();
            let phase = 0;

            const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
            window.onresize = resize; resize();

            const layers = [
                { count: 10, size: [0.2, 0.3], speed: 0.2, alpha: 0.1 },
                { count: 20, size: [0.3, 0.5], speed: 0.3, alpha: 0.1 },
                { count: 40, size: [0.6, 1.4], speed: 0.5, alpha: 0.2 },
                { count: 60, size: [1.6, 2.8], speed: 1.2, alpha: 0.45 },
                { count: 30, size: [3.5, 5.5], speed: 2.2, alpha: 0.75 }
            ];

            layers.forEach((layer, layerIdx) => {
                for(let i=0; i<layer.count; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: Math.random() * (layer.size[1] - layer.size[0]) + layer.size[0],
                        layerIdx: layerIdx,
                        speedMult: layer.speed,
                        alpha: layer.alpha,
                        baseSpeed: Math.random() * 50 + 40,
                        offset: Math.random() * 10
                    });
                }
            });

            function loop(currentTime) {
                let dt = (currentTime - lastTime) / 1000;
                lastTime = currentTime;
                if (dt > 0.2) dt = 0; 
                phase += dt;
                if (phase > 62.83) phase = 0; 

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const windEffect = 1 + Math.pow(Math.abs(Math.sin(0.3)), 10) * 12;

                particles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();

                    p.y += p.baseSpeed * p.speedMult * dt;
                    p.x += Math.sin(phase + p.offset);

                    if(p.y > canvas.height + 20) {
                        p.y = -20;
                        p.x = Math.random() * canvas.width;
                    }
                });
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        async function build() {
            const btn = document.getElementById('dl-btn');
            const pWrap = document.getElementById('p-wrap');
            const pFill = document.getElementById('p-fill');
            btn.disabled = true; pWrap.style.opacity = '1';
            
            const zip = new JSZip();
            const items = [...selected];
            try {
                for(let i=0; i<items.length; i++) {
                    const m = CONFIG.flatMap(c => c.mods).find(x => x.id === items[i]);
                    const res = await fetch(`https://ssixm.github.io/VpkDota2Mods/vpk/${m.file}`);
                    zip.file(`pak${(50+i).toString().padStart(2, '0')}_dir.vpk`, await res.arrayBuffer());
                    pFill.style.width = `${((i+1)/items.length)*100}%`;
                }
                const blob = await zip.generateAsync({type:"blob"});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `VPK_CORE_PACK.zip`;
                a.click();
            } finally {
                btn.disabled = false;
                setTimeout(() => { pWrap.style.opacity = '0'; pFill.style.width = '0%'; }, 2000);
            }
        }

        function shareSet() {
            if(!selected.size) return;
            const code = btoa(JSON.stringify([...selected]));
            navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?set=${code}`);
            const t = document.getElementById('toast');
            t.textContent = TRANSLATIONS[lang].copy; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        window.onload = () => {
            initSnow();
            setLang(lang);
            const params = new URLSearchParams(window.location.search);
            if(params.has('set')) {
                try { selected = new Set(JSON.parse(atob(params.get('set')))); updateSelection(); } catch(e) {}
            }
            loadConfig();
        };
    </script>
</body>
</html>
