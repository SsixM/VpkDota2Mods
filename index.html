<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPK CORE | Dota 2 Mod Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;800&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://raw.githubusercontent.com/SsixM/VpkDota2Mods/refs/heads/main/src/favicon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/themes.css">
    <script src="https://raw.githack.com/h6rd/Dota2PornFxWeb/main/assets/mods.js"></script>
</head>
<body class="theme-core">
    <div class="bg-mesh" id="mesh"></div>
    <div class="bg-glow"></div>
    <div id="snow-container"></div>

    <div class="relative z-10 min-h-screen flex flex-col p-6 md:p-12 pb-56">
        <header class="max-w-7xl mx-auto w-full mb-20 flex flex-col lg:flex-row justify-between items-end gap-10">
            <div class="w-full lg:w-auto">
                <h1 class="font-heading text-7xl md:text-9xl font-black tracking-tighter leading-none mb-6 title-glow">VPK<span style="color:var(--accent)">.</span>CORE</h1>
                <div class="flex items-center gap-4">
                    <div class="inline-flex items-center gap-3 px-6 py-2.5 bg-white/5 border border-white/5 rounded-full backdrop-blur-xl">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_#22c55e]"></span>
                        <span id="label-update" class="text-[10px] font-black uppercase tracking-[0.3em] text-neutral-400">Syncing...</span>
                    </div>
                </div>
            </div>

            <div class="flex flex-col items-end gap-5 w-full lg:w-auto">
                <div class="flex items-center gap-4 w-full">
                    <div class="flex items-center bg-white/5 border border-white/5 rounded-3xl px-8 py-5 backdrop-blur-2xl focus-within:border-white/20 flex-grow lg:w-96 transition-all">
                        <input type="text" id="search-input" class="bg-transparent border-none outline-none w-full text-sm font-bold text-white placeholder:text-neutral-600" spellcheck="false">
                    </div>
                    
                    <div class="flex items-center gap-5 bg-white/5 p-4 rounded-3xl border border-white/5 shrink-0 backdrop-blur-2xl">
                        <div class="flex gap-4 px-2 border-r border-white/10 pr-6">
                            <div onclick="setTheme('core')" class="theme-dot bg-indigo-500" title="Core"></div>
                            <div onclick="setTheme('crimson')" class="theme-dot bg-red-500" title="Crimson"></div>
                            <div onclick="setTheme('emerald')" class="theme-dot bg-emerald-400" title="Emerald"></div>
                            <div onclick="setTheme('midas')" class="theme-dot bg-amber-400" title="Midas"></div>
                            <div onclick="setTheme('void')" class="theme-dot bg-purple-500" title="Void"></div>
                        </div>
                        <div class="flex gap-4">
                            <button onclick="setLang('ru')" id="lang-ru" class="text-[11px] font-black cursor-pointer hover:text-white">RU</button>
                            <button onclick="setLang('en')" id="lang-en" class="text-[11px] font-black cursor-pointer hover:text-white">EN</button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main id="app-content" class="max-w-7xl mx-auto w-full flex-grow"></main>

        <div class="control-panel">
            <div class="glass-card p-7 shadow-2xl flex flex-col gap-6">
                <div class="flex justify-between items-end px-1">
                    <div>
                        <p id="label-selected" class="text-[10px] uppercase font-black text-neutral-500 tracking-widest mb-2 opacity-60">Selection</p>
                        <div class="flex items-baseline gap-2">
                            <span id="count" class="text-6xl font-heading font-black leading-none" style="color:var(--accent)">0</span>
                            <span id="items" class="text-xs font-bold text-neutral-600 uppercase">Items</span>
                        </div>
                    </div>
                    <button onclick="toggleSummary()" class="p-4 bg-white/5 hover:bg-white/10 rounded-2xl text-neutral-400 hover:text-white transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16m-7 6h7" stroke-width="2.5" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <div id="p-wrap" class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden opacity-0">
                    <div id="p-fill" class="h-full bg-white w-0 shadow-[0_0_20px_#fff] transition-all duration-300"></div>
                </div>
                <button id="dl-btn" onclick="build()" class="btn-build">Build VPK</button>
            </div>
        </div>
    </div>

    <div id="modal-summary" class="modal-overlay" onclick="if(event.target === this) toggleSummary()">
        <div class="modal-content">
            <div class="p-10 border-b border-white/5 flex justify-between items-center bg-white/[0.02]">
                <h2 class="font-heading text-4xl font-bold" id="modal-title"></h2>
                <button onclick="toggleSummary()" class="w-14 h-14 flex items-center justify-center bg-white/5 rounded-3xl hover:bg-red-500/20 hover:text-red-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="3" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="flex-grow overflow-y-auto p-10 bg-[#06070a]">
                <div id="modal-list"></div>
            </div>
            <div class="p-10 bg-white/[0.02] border-t border-white/5">
                <button onclick="toggleSummary()" class="w-full py-6 bg-white text-black rounded-3xl font-black text-sm uppercase tracking-widest" id="btn-modal-close"></button>
            </div>
        </div>
    </div>
    <div id="toast"></div>
    
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/i18n.js"></script>

    <script src="js/audio.js"></script>
    <script src="js/ui-helper.js"></script>

    <script src="js/snow.js"></script>
    <script src="js/background.js"></script>

    <script src="js/render-cards.js"></script>
    <script src="js/modals.js"></script>

    <script src="js/mod-manager.js"></script>
    <script src="js/builder.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
