<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPK DOTA | Premium Workshop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --panel-bg: rgba(15, 23, 42, 0.8);
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        #snow-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .mod-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .mod-card.selected {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(15, 23, 42, 0.9) 100%);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .btn-main {
            background: linear-gradient(90deg, #4f46e5, #8b5cf6);
            box-shadow: 0 10px 30px -5px rgba(79, 70, 229, 0.5);
            transition: all 0.3s ease;
        }

        .btn-main:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        .faq-item {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
        }
    </style>
</head>
<body>

    <canvas id="snow-canvas"></canvas>
    <div class="bg-grid"></div>

    <header class="relative pt-20 pb-12 px-6">
        <div class="max-w-7xl mx-auto text-center relative z-10">
            <div class="inline-block px-4 py-1.5 mb-6 border border-indigo-500/30 rounded-full bg-indigo-500/10 text-indigo-400 text-xs font-bold tracking-widest uppercase">
                Safe Build v2.1
            </div>
            <h1 class="orbitron text-6xl md:text-8xl font-black mb-6">
                VPK<span class="text-indigo-500 italic">MODS</span>
            </h1>
            <p id="tagline" class="text-slate-400 text-xl md:text-2xl font-light max-w-3xl mx-auto leading-relaxed"></p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pb-40">
        <div class="flex items-center justify-between mb-10">
            <h2 class="orbitron text-2xl font-bold">Библиотека модов</h2>
            <button id="resetAll" class="text-sm text-slate-500 hover:text-indigo-400 transition-colors flex items-center gap-2">
                <span>Очистить выбор</span>
            </button>
        </div>

        <div id="modsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>

        <div class="mt-32 max-w-4xl mx-auto">
            <h2 class="orbitron text-3xl font-bold mb-10 text-center">Инструкция</h2>
            <div class="space-y-4">
                <div class="faq-item p-6">
                    <h3 class="font-bold text-indigo-400 mb-2">Как установить?</h3>
                    <p class="text-slate-400 text-sm">Распакуйте VPK файлы из архива в папку: <br> <code>steamapps\common\dota 2 beta\game\dota</code></p>
                </div>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 w-full p-8 z-50 pointer-events-none">
        <div class="max-w-xl mx-auto pointer-events-auto">
            <button id="dlBtn" onclick="generateArchive()" class="btn-main w-full py-6 rounded-3xl flex items-center justify-center gap-6 group disabled:opacity-50">
                <div class="flex flex-col items-start text-white">
                    <span id="dlText" class="text-lg font-extrabold uppercase tracking-wider">Создать сборку</span>
                    <span id="dlSub" class="text-xs opacity-70 font-bold">Выбрано элементов: 0</span>
                </div>
            </button>
        </div>
    </div>

    <script>
        const mods = [
            { id: 1, name: 'Papich Voice', file: 'Papich.vpk', img: 'Papich.jpg', desc: 'Легендарная озвучка от Величайшего.' },
            { id: 2, name: 'White SF', file: 'white_sf.vpk', img: 'white_sf.jpg', desc: 'Эстетичный белый облик для Shadow Fiend.' },
            { id: 3, name: 'Lena Golovach', file: 'Golovach.vpk', img: 'Golovach.jpg', desc: 'Озвучка от Лены Головача.' },
            { id: 4, name: 'Minify Effects', file: 'minifyBaseattack.vpk', img: 'minifybaseattack.jpg', desc: 'Минималистичные атаки.' },
            { id: 5, name: 'Ultra FPS', file: 'optimization.vpk', img: 'optimization.jpg', desc: 'Максимальный FPS.' },
            { id: 6, name: 'Visual Trees', file: 'pilltree.vpk', img: 'pilltree.jpg', desc: 'Деревья-таблетки.' },
            { id: 7, name: 'Clean River', file: 'removeriver.vpk', img: 'removeriver.jpg', desc: 'Удаляет воду в реке.' },
            { id: 8, name: 'Dota+ Stats', file: 'shownetworth.vpk', img: 'shownetworth.jpg', desc: 'Нетворс без подписки.' },
            { id: 9, name: 'Fast Accept', file: 'autoacceptmatch.vpk', img: 'autoacceptmatch.jpg', desc: 'Мгновенное принятие матча.' },
            { id: 10, name: 'Dark Theme', file: 'DarkTerrain.vpk', img: 'Muteembient.jpg', desc: 'Темный ландшафт карты.' }
        ];

        let selected = new Set();

        // Снег
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let flakes = [];

        function initSnow() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for(let i=0; i<80; i++) {
                flakes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    s: Math.random() * 2 + 1,
                    d: Math.random() * 1
                });
            }
            animateSnow();
        }

        function animateSnow() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255,255,255,0.2)";
            ctx.beginPath();
            flakes.forEach(f => {
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.s, 0, Math.PI*2);
                f.y += f.s * 0.4;
                if(f.y > canvas.height) f.y = -10;
            });
            ctx.fill();
            requestAnimationFrame(animateSnow);
        }

        function render() {
            const grid = document.getElementById('modsGrid');
            grid.innerHTML = mods.map(m => `
                <div class="mod-card rounded-[2rem] p-4 flex flex-col ${selected.has(m.id) ? 'selected' : ''}" onclick="selectMod(${m.id}, this)">
                    <div class="relative h-48 rounded-[1.5rem] overflow-hidden mb-4">
                        <img src="https://ssixm.github.io/VpkDota2Mods/src/${m.img}" class="w-full h-full object-cover">
                    </div>
                    <div class="px-2">
                        <h3 class="orbitron text-lg font-bold mb-1">${m.name}</h3>
                        <p class="text-slate-400 text-xs opacity-70">${m.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        function selectMod(id, el) {
            selected.has(id) ? selected.delete(id) : selected.add(id);
            el.classList.toggle('selected');
            updateUI();
        }

        function updateUI() {
            document.getElementById('dlSub').textContent = `Выбрано элементов: ${selected.size}`;
            document.getElementById('dlBtn').disabled = selected.size === 0;
        }

        async function generateArchive() {
            const btn = document.getElementById('dlBtn');
            const txt = document.getElementById('dlText');
            btn.disabled = true;
            txt.textContent = "СКАЧИВАНИЕ...";

            const zip = new JSZip();
            const selectedArray = [...selected];

            try {
                for (let i = 0; i < selectedArray.length; i++) {
                    const modId = selectedArray[i];
                    const mod = mods.find(m => m.id === modId);
                    
                    const response = await fetch(`https://ssixm.github.io/VpkDota2Mods/vpk/${mod.file}`);
                    if (!response.ok) throw new Error("Network error");
                    
                    const blob = await response.blob();
                    const pakNum = (50 + i).toString().padStart(2, '0');
                    
                    // Просто кладем файл в архив, без вложенных папок
                    zip.file(`pak${pakNum}_dir.vpk`, blob);
                }

                txt.textContent = "УПАКОВКА...";
                const content = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'DOTA_MODS_PACK.zip';
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert("Ошибка загрузки!");
            } finally {
                btn.disabled = false;
                txt.textContent = "Создать сборку";
            }
        }

        document.getElementById('tagline').textContent = "Преврати свою игру в произведение искусства.";
        document.getElementById('resetAll').onclick = () => { selected.clear(); render(); updateUI(); };

        window.onload = () => { initSnow(); render(); updateUI(); };
    </script>
</body>
</html>
