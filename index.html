<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPK CORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://raw.githubusercontent.com/SsixM/VpkDota2Mods/refs/heads/main/src/favicon.jpg" type="image/x-icon">
    <style>
        :root {
            --accent: #6366f1;
            --bg: #010204;
            --card-bg: rgba(10, 12, 18, 0.7);
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .font-heading { font-family: 'Space Grotesk', sans-serif; }

        #snow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            will-change: transform;
        }

        .bg-glow {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% -10%, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
            z-index: 0;
        }

        .scene-transition {
            animation: sceneEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes sceneEnter {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .folder-preview {
            position: relative; height: 180px; display: flex; justify-content: center; align-items: center;
        }
        .folder-img {
            position: absolute; width: 70%; height: 85%;
            border-radius: 24px; object-fit: cover;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .img-1 { transform: translateZ(30px); z-index: 3; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .img-2 { transform: rotate(-12deg) translateX(-20%) scale(0.9); z-index: 2; opacity: 0.4; }
        
        .glass-card:hover .img-1 { transform: scale(1.08) translateY(-10px); }
        .glass-card:hover .img-2 { transform: rotate(-18deg) translateX(-35%) scale(0.95); opacity: 0.7; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 32px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.4s ease;
        }
        .mod-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            background: rgba(255,255,255,0.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .mod-selected {
            border-color: var(--accent) !important;
            background: rgba(99, 102, 241, 0.15) !important;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.15);
        }

        .check-overlay {
            position: absolute; inset: 0;
            background: rgba(99, 102, 241, 0.2);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none;
            border-radius: 1rem;
        }
        .mod-selected .check-overlay { opacity: 1; }

        .lang-node {
            padding: 6px 14px; border-radius: 12px; font-size: 11px; font-weight: 800;
            cursor: pointer; transition: all 0.3s; color: #64748b;
        }
        .lang-node.active { background: var(--accent); color: #fff; }

        /* Фиксированная панель справа снизу */
        .control-panel {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 100;
            width: 280px;
        }

        #toast {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%) translateY(-30px);
            background: #6366f1; color: white; padding: 12px 28px; border-radius: 100px;
            font-size: 13px; font-weight: 700; opacity: 0; transition: all 0.5s;
            z-index: 10000;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Отступ снизу для контента, чтобы не перекрывался панелью */
        .main-container { padding-bottom: 180px; }
    </style>
</head>
<body>

    <canvas id="snow"></canvas>
    <div class="bg-glow"></div>

    <div class="relative z-10 min-h-screen flex flex-col p-8 md:p-16 main-container">
        <header class="max-w-7xl mx-auto w-full mb-20 flex flex-col md:flex-row justify-between items-end gap-12">
            <div>
                <h1 class="font-heading text-8xl font-black tracking-tighter leading-none mb-6 scene-transition">VPK<span class="text-indigo-500">.</span>CORE</h1>
                <div class="px-5 py-2 bg-emerald-500/5 border border-emerald-500/10 rounded-full inline-flex items-center gap-3">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span id="label-update" class="text-[10px] font-bold uppercase tracking-[0.2em] text-emerald-400">Update: 28.12.2025</span>
                </div>
            </div>

            <div class="flex items-center gap-6 w-full md:w-auto">
                <div class="flex items-center bg-white/5 border border-white/5 rounded-2xl px-5 py-4 backdrop-blur-3xl focus-within:border-indigo-500/40 transition-all flex-grow md:w-80">
                    <input type="text" id="search-input" placeholder="Поиск..." class="bg-transparent border-none outline-none w-full text-sm">
                </div>
                <div class="flex bg-white/5 p-1 rounded-xl border border-white/10">
                    <div onclick="setLang('ru')" id="lang-ru" class="lang-node">RU</div>
                    <div onclick="setLang('en')" id="lang-en" class="lang-node">EN</div>
                </div>
            </div>
        </header>

        <main id="app-content" class="max-w-7xl mx-auto w-full flex-grow"></main>

        <div class="control-panel scene-transition">
            <div class="glass-card p-6 border-white/10 shadow-2xl flex flex-col gap-5">
                <div class="flex justify-between items-end">
                    <div>
                        <p id="label-selected" class="text-[9px] uppercase font-black text-neutral-500 tracking-widest mb-1">Selected</p>
                        <span id="count" class="text-5xl font-heading font-black text-indigo-500 leading-none">0</span>
                    </div>
                    <button onclick="shareSet()" class="p-4 bg-white/5 hover:bg-indigo-500/20 rounded-2xl text-neutral-400 hover:text-white transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" stroke-width="2.5"/></svg>
                    </button>
                </div>
                
                <div id="p-wrap" class="h-1 w-full bg-white/5 rounded-full overflow-hidden opacity-0 transition-opacity">
                    <div id="p-fill" class="h-full bg-indigo-500 w-0 transition-all"></div>
                </div>

                <button id="dl-btn" onclick="build()" class="w-full bg-white text-black py-5 rounded-2xl font-black text-xs uppercase tracking-[0.2em] hover:bg-indigo-50 transition-colors disabled:opacity-20 disabled:cursor-not-allowed shadow-lg">
                    Build
                </button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const JSON_URL = 'https://ssixm.github.io/VpkDota2Mods/src/config.json';
        const TRANSLATIONS = {
            ru: { search: 'Поиск модификаций...', selected: 'Выбрано', back: '← Назад', build: 'Собрать VPK', copy: 'Ссылка скопирована!', modsCount: 'Модов' },
            en: { search: 'Search mods...', selected: 'Selected', back: '← Back', build: 'Build VPK', copy: 'Link copied!', modsCount: 'Mods' }
        };

        let CONFIG = [];
        let lang = localStorage.getItem('vpk_lang') || 'ru';
        let selected = new Set(JSON.parse(localStorage.getItem('vpk_selected') || '[]'));
        let currentCat = null;

        async function loadConfig() {
            try {
                const res = await fetch(JSON_URL);
                CONFIG = await res.json();
            } catch (e) { console.error(e); }
            renderCategories();
        }

        function setLang(l) {
            lang = l;
            localStorage.setItem('vpk_lang', l);
            document.querySelectorAll('.lang-node').forEach(n => n.classList.toggle('active', n.id === `lang-${l}`));
            document.getElementById('search-input').placeholder = TRANSLATIONS[lang].search;
            document.getElementById('label-selected').textContent = TRANSLATIONS[lang].selected;
            document.getElementById('dl-btn').textContent = TRANSLATIONS[lang].build;
            currentCat ? renderMods(currentCat) : renderCategories();
        }

        function renderCategories(filter = '') {
            currentCat = null;
            const filtered = CONFIG.filter(c => c[lang].toLowerCase().includes(filter.toLowerCase()));
            document.getElementById('app-content').innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-10 scene-transition">
                ${filtered.map(cat => `
                    <div onclick="renderMods('${cat.id}')" class="glass-card p-10 cursor-pointer group">
                        <div class="folder-preview mb-8">
                            <img src="https://ssixm.github.io/VpkDota2Mods/src/${cat.mods[0].img}" class="folder-img img-1">
                            <img src="https://ssixm.github.io/VpkDota2Mods/src/${cat.mods[1]?.img || cat.mods[0].img}" class="folder-img img-2">
                        </div>
                        <h3 class="font-heading text-4xl font-black mb-2 group-hover:text-indigo-400 transition-colors">${cat[lang]}</h3>
                        <p class="text-neutral-600 text-[10px] uppercase font-bold tracking-widest">${cat.mods.length} ${TRANSLATIONS[lang].modsCount}</p>
                    </div>
                `).join('')}
            </div>`;
            updateSelection();
        }

        function renderMods(catId, filter = '') {
            currentCat = catId;
            const cat = CONFIG.find(c => c.id === catId);
            const filtered = cat.mods.filter(m => m['name_'+lang].toLowerCase().includes(filter.toLowerCase()));

            document.getElementById('app-content').innerHTML = `
                <div class="scene-transition">
                    <button onclick="renderCategories()" class="mb-10 text-neutral-500 font-bold uppercase text-[10px] tracking-widest hover:text-white transition-colors">${TRANSLATIONS[lang].back}</button>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        ${filtered.map(m => `
                            <div onclick="toggleMod(${m.id}, '${catId}')" id="mod-${m.id}" class="glass-card mod-card p-5 cursor-pointer ${selected.has(m.id) ? 'mod-selected' : ''}">
                                <div class="aspect-video rounded-2xl overflow-hidden mb-5 relative bg-black">
                                    <img src="https://ssixm.github.io/VpkDota2Mods/src/${m.img}" class="w-full h-full object-cover">
                                    <div class="check-overlay"><svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg></div>
                                </div>
                                <h4 class="font-heading text-lg font-bold leading-tight">${m['name_'+lang]}</h4>
                                <p class="text-neutral-500 text-[9px] uppercase mt-2 font-bold tracking-tighter opacity-60">${m['desc_'+lang] || ''}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            currentCat ? renderMods(currentCat, e.target.value) : renderCategories(e.target.value);
        });

        function toggleMod(id, catId) {
            const cat = CONFIG.find(c => c.id === catId);
            if(cat.exclusive) {
                cat.mods.forEach(m => {
                    if(m.id !== id && selected.has(m.id)) {
                        selected.delete(m.id);
                        document.getElementById(`mod-${m.id}`)?.classList.remove('mod-selected');
                    }
                });
            }
            selected.has(id) ? selected.delete(id) : selected.add(id);
            localStorage.setItem('vpk_selected', JSON.stringify([...selected]));
            updateSelection();
            const card = document.getElementById(`mod-${id}`);
            if(card) card.classList.toggle('mod-selected', selected.has(id));
        }

        function updateSelection() {
            document.getElementById('count').textContent = selected.size;
            document.getElementById('dl-btn').disabled = !selected.size;
        }

        function initSnow() {
            const canvas = document.getElementById('snow'); const ctx = canvas.getContext('2d');
            let particles = [], lastTime = performance.now(), phase = 0;
            const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
            window.onresize = resize; resize();
            for(let i=0; i<120; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*2+1, speedMult: Math.random()*1+0.5, alpha: Math.random()*0.5, offset: Math.random()*10 });
            function loop(currentTime) {
                let dt = (currentTime - lastTime) / 1000; lastTime = currentTime;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                phase += dt;
                particles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
                    p.y += 40 * p.speedMult * dt; p.x += Math.sin(phase + p.offset) * 0.5;
                    if(p.y > canvas.height) { p.y = -10; p.x = Math.random()*canvas.width; }
                });
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        async function build() {
            const btn = document.getElementById('dl-btn'), pWrap = document.getElementById('p-wrap'), pFill = document.getElementById('p-fill');
            btn.disabled = true; pWrap.style.opacity = '1';
            const zip = new JSZip(), items = [...selected];
            try {
                for(let i=0; i<items.length; i++) {
                    const m = CONFIG.flatMap(c => c.mods).find(x => x.id === items[i]);
                    const res = await fetch(`https://ssixm.github.io/VpkDota2Mods/vpk/${m.file}`);
                    zip.file(`pak${(50+i).toString().padStart(2, '0')}_dir.vpk`, await res.arrayBuffer());
                    pFill.style.width = `${((i+1)/items.length)*100}%`;
                }
                const blob = await zip.generateAsync({type:"blob"});
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `VPK_PACK.zip`; a.click();
            } finally { 
                btn.disabled = false; 
                setTimeout(() => { pWrap.style.opacity = '0'; pFill.style.width = '0%'; }, 2000); 
            }
        }

        function shareSet() {
            if(!selected.size) return;
            const code = btoa(JSON.stringify([...selected]));
            navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?set=${code}`);
            const t = document.getElementById('toast'); t.textContent = TRANSLATIONS[lang].copy; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        window.onload = () => { 
            initSnow(); setLang(lang); 
            const p = new URLSearchParams(window.location.search);
            if(p.has('set')) try { selected = new Set(JSON.parse(atob(p.get('set')))); updateSelection(); } catch(e){}
            loadConfig(); 
        };
    </script>
</body>
</html>
