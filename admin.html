<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VPK.MANAGER | TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #818cf8; --bg: #050507; --panel: #0d0e12; }
        body { background: var(--bg); color: #a1a1aa; font-family: 'Plus Jakarta Sans', sans-serif; }
        .terminal-border { border: 1px solid rgba(129, 140, 248, 0.1); transition: 0.3s; }
        .terminal-border:focus-within { border-color: var(--accent); box-shadow: 0 0 20px rgba(129, 140, 248, 0.1); }
        .input-clean { background: transparent; border: none; outline: none; color: white; width: 100%; }
        .mod-card { background: var(--panel); border-radius: 16px; border: 1px solid rgba(255,255,255,0.03); }
        .btn-action { background: var(--accent); color: #000; font-weight: 800; padding: 10px 20px; border-radius: 8px; font-size: 11px; text-transform: uppercase; cursor: pointer; }
        .loading-bar { height: 2px; width: 0%; background: var(--accent); position: fixed; top: 0; left: 0; transition: 0.3s; z-index: 100; }
        #admin-panel { display: none; }
        .loader { display: none; position: fixed; top: 20px; right: 20px; font-family: 'JetBrains Mono'; font-size: 10px; color: var(--accent); }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="loading-bar" id="progress"></div>
    <div class="loader" id="sync-loader">SYNCING_WITH_GITHUB...</div>

    <div id="login-form" class="max-w-xs mx-auto mt-40">
        <h1 class="font-black text-2xl text-white mb-6 tracking-tighter italic">VPK.AUTH</h1>
        <div class="terminal-border p-4 rounded-xl mb-4">
            <input type="password" id="pass" class="input-clean" placeholder="TERMINAL_KEY">
        </div>
        <button onclick="start()" class="btn-action w-full">Access</button>
    </div>

    <div id="admin-panel" class="max-w-6xl mx-auto">
        <header class="flex justify-between items-end mb-12">
            <div>
                <h1 class="font-black text-4xl text-white tracking-tighter">VPK<span class="text-indigo-400">.</span>CORE</h1>
                <p class="text-[10px] font-mono opacity-40">REMOTE_REPO: github.com/SsixM/VpkDota2Mods</p>
            </div>
            <button onclick="sync('add_cat', {id: 'new_'+Date.now()})" class="btn-action">+ New Category</button>
        </header>

        <div id="content" class="space-y-16"></div>
    </div>

    <script>
        let config = [];
        let pass = "";
        const API = "https://genterfd3.pythonanywhere.com/api";

        async function start() {
            pass = document.getElementById('pass').value;
            const res = await fetch("https://ssixm.github.io/VpkDota2Mods/src/config.json");
            config = await res.json();
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            render();
        }

        async function sync(type, payload) {
            document.getElementById('progress').style.width = '50%';
            document.getElementById('sync-loader').style.display = 'block';
            try {
                const res = await fetch(`${API}/action`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pass, type, payload})
                });
                const data = await res.json();
                if(data.success) {
                    config = data.config;
                    render();
                }
            } finally {
                document.getElementById('progress').style.width = '100%';
                setTimeout(() => {
                    document.getElementById('progress').style.width = '0%';
                    document.getElementById('sync-loader').style.display = 'none';
                }, 500);
            }
        }

        async function upload(input, cIdx, mIdx, type) {
            const fd = new FormData();
            fd.append('file', input.files[0]);
            fd.append('password', pass);
            fd.append('folder', type === 'img' ? 'src/media' : 'vpk');
            
            document.getElementById('sync-loader').innerText = "UPLOADING_FILE...";
            document.getElementById('sync-loader').style.display = 'block';

            const res = await fetch(`${API}/upload`, { method: 'POST', body: fd });
            const data = await res.json();
            if(data.success) {
                const finalPath = type === 'img' ? `media/${data.filename}` : data.filename;
                const mod = config[cIdx].mods[mIdx];
                mod[type] = finalPath;
                sync('edit_mod', {id: mod.id, data: {[type]: finalPath}});
            }
        }

        function render() {
            const root = document.getElementById('content');
            root.innerHTML = config.map((cat, ci) => `
                <div class="space-y-6">
                    <div class="flex items-center gap-6 border-b border-white/5 pb-4">
                        <input class="font-black text-xl text-white bg-transparent outline-none w-48" value="${cat.ru}" onchange="sync('edit_cat', {old_id: '${cat.id}', id: '${cat.id}', ru: this.value, en: '${cat.en}', exclusive: ${cat.exclusive}})">
                        <input class="font-mono text-[10px] opacity-30 bg-transparent outline-none w-32" value="${cat.id}" onchange="sync('edit_cat', {old_id: '${cat.id}', id: this.value, ru: '${cat.ru}', en: '${cat.en}', exclusive: ${cat.exclusive}})">
                        <button onclick="sync('add_mod', {cat_id: '${cat.id}'})" class="text-[10px] text-emerald-400 font-bold hover:underline tracking-widest">+ ADD_MOD</button>
                        <button onclick="sync('del_cat', {id: '${cat.id}'})" class="text-[10px] text-red-500 font-bold hover:underline tracking-widest ml-auto">DELETE_CAT</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${cat.mods.map((m, mi) => `
                            <div class="mod-card p-6 space-y-4">
                                <div class="flex gap-4">
                                    <input class="input-clean font-bold text-sm" value="${m.name_ru}" onchange="sync('edit_mod', {id: ${m.id}, data: {name_ru: this.value}})">
                                    <input class="input-clean font-bold text-sm opacity-50" value="${m.name_en}" onchange="sync('edit_mod', {id: ${m.id}, data: {name_en: this.value}})">
                                </div>
                                <div class="grid grid-cols-2 gap-4 text-[10px]">
                                    <div class="terminal-border p-2 rounded-lg">
                                        <p class="opacity-30 mb-1">VPK 1: ${m.file || 'NONE'}</p>
                                        <input type="file" onchange="upload(this, ${ci}, ${mi}, 'file')" class="w-full">
                                    </div>
                                    <div class="terminal-border p-2 rounded-lg">
                                        <p class="opacity-30 mb-1">VPK 2: ${m.file2 || 'NONE'}</p>
                                        <input type="file" onchange="upload(this, ${ci}, ${mi}, 'file2')" class="w-full">
                                    </div>
                                    <div class="terminal-border p-2 rounded-lg col-span-2">
                                        <p class="opacity-30 mb-1">IMG: ${m.img || 'NONE'}</p>
                                        <input type="file" onchange="upload(this, ${ci}, ${mi}, 'img')" class="w-full">
                                    </div>
                                </div>
                                <textarea class="input-clean text-xs opacity-60 h-12" placeholder="Desc RU" onchange="sync('edit_mod', {id: ${m.id}, data: {desc_ru: this.value}})">${m.desc_ru}</textarea>
                                <textarea class="input-clean text-xs opacity-60 h-12" placeholder="Desc EN" onchange="sync('edit_mod', {id: ${m.id}, data: {desc_en: this.value}})">${m.desc_en}</textarea>
                                <div class="flex justify-between items-center pt-2">
                                    <select class="bg-white/5 text-[10px] p-1 rounded" onchange="sync('move_mod', {id: ${m.id}, target_id: this.value})">
                                        <option value="">MOVE_TO...</option>
                                        ${config.map(c => `<option value="${c.id}">${c.ru}</option>`).join('')}
                                    </select>
                                    <button onclick="sync('del_mod', {id: ${m.id}})" class="text-red-500 font-bold text-[10px]">REMOVE</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
